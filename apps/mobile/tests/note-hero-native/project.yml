name: NoteHeroRegression
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: KAMM5N88X3
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
targets:
  NoteHeroTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NoteHeroTests.swift
      - ../../modules/yohaku/ios/List/YohakuStretchCoverView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.innei.yohaku.hero-tests
  NativeScrollBindingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NativeScrollBindingTests.mm
      - ../../modules/yohaku/ios/List/YohakuScrollDelegateBinding.mm
      - ../../modules/yohaku/ios/List/YohakuScrollDelegateBinding.h
    dependencies:
      - sdk: UIKit.framework
      - framework: ../../ios/Pods/React-Core-prebuilt/React.xcframework
        embed: true
      - framework: ../../ios/Pods/ReactNativeDependencies/framework/packages/react-native/ReactNativeDependencies.xcframework
        embed: true
      - framework: ../../ios/Pods/hermes-engine/destroot/Library/Frameworks/universal/hermesvm.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.innei.yohaku.native-scroll-tests
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        GCC_PREPROCESSOR_DEFINITIONS: [$(inherited), FOLLY_NO_CONFIG=1, FOLLY_MOBILE=1, FOLLY_USE_LIBCPP=1, FOLLY_CFG_NO_COROUTINES=1]
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../../ios/Pods/Headers/Public
          - $(SRCROOT)/../../ios/Pods/Headers/Private/Yoga
          - $(SRCROOT)/../../modules/yohaku/ios/List
          - $(SRCROOT)/../../ios/Pods/Headers/Public/FBLazyVector
          - $(SRCROOT)/../../ios/Pods/Headers/Public/RCTDeprecation
          - $(SRCROOT)/../../ios/Pods/Headers/Public/RCTRequired
          - $(SRCROOT)/../../ios/Pods/Headers/Public/RCTSwiftUIWrapper
          - $(SRCROOT)/../../ios/Pods/Headers/Public/RCTTypeSafety
          - $(SRCROOT)/../../ios/Pods/Headers/Public/React-Core
          - $(SRCROOT)/../../ios/Pods/Headers/Public/React-Core-prebuilt
          - $(SRCROOT)/../../ios/Pods/Headers/Public/React-CoreModules
          - $(SRCROOT)/../../ios/Pods/Headers/Public/React-Fabric
