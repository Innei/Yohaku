overrides:
  '@expo/dom-webview': link:./packages/dom-webview
  react: 19.3.1
  react-dom: 19.3.1
  # expo lists this so autolinking ships ExpoFileSystem.framework; Yohaku
  # never calls FileSystem APIs. Drop the package so it cannot re-enter the IPA.
  expo-file-system: '-'
  # Editor stack tracks a single lexical runtime copy; keep in lockstep with
  # the @haklex/* peer floor (^0.52 as of @haklex 0.46.0).
